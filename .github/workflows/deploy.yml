name: Deploy

on:
  push:
    branches: [ main ]

# Runs ON clanker via a self-hosted runner (outbound poll, no inbound SSH).
# Builds the image locally and restarts the container via /opt/who-pays/deploy.sh.
jobs:
  build_and_deploy:
    runs-on: [self-hosted, clanker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build image locally
        run: docker build -t who-pays:latest .

      - name: Deploy
        run: /opt/who-pays/deploy.sh
